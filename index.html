<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sente Shogi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script>
        // Мгновенная проверка темы при загрузке страницы
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
    </script>

    <div class="theme-wrapper" style="margin-top: 10px;">
        <button id="theme-toggle" style="cursor:pointer; padding: 10px; border-radius: 12px; border: none; background: var(--green-main); color: white;">🌙 Тема</button>
    </div>

    <div class="game-container">
        <div class="komadai-wrapper">
            <div class="player-label">Готэ (Белые)</div>
            <div id="hand-white" class="komadai"></div>
        </div>

        <div id="board"></div>

        <div class="komadai-wrapper">
            <div id="hand-black" class="komadai"></div>
            <div class="player-label">Сенте (Черные)</div>
        </div>
    </div>

    <div id="status">Загрузка игры...</div>

    <script src="app.js"></script>
    <script>
        // Логика переключения темы
        const themeBtn = document.getElementById('theme-toggle');
        themeBtn.onclick = () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeBtn.textContent = isDark ? "☀️ Свет" : "🌙 Тема";
        };
    </script>
</body>
</html>
